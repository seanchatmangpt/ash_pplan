# What the sync surface actually runs: bin/manufacture* invoke
# `mix ggen_igniter.sync --pack-dir <pack>` against these six packs with
# --engine oxigraph. Locked by default (Rust PackRef lock default = true).
[packs.ash-pplan]
path = "priv/ggen/ash-pplan-pack"
[packs.ash-pplan-workflow]
path = "priv/ggen/ash-pplan-workflow-pack"
[packs.ash-pplan-standing]
path = "priv/ggen/ash-pplan-standing-pack"
[packs.ash-pplan-store-conformance]
path = "priv/ggen/ash-pplan-store-conformance-pack"
[packs.ash-pplan-durable-tla]
path = "priv/ggen/ash-pplan-durable-tla-pack"
[packs.ash-pplan-durable-chaos]
path = "priv/ggen/ash-pplan-durable-chaos-pack"
[packs.ash-pplan-igniter]
path = "priv/ggen/ash-pplan-igniter-pack"

# ECO-PROTOCOL-COURT adoption: the generalized TLA+/TLC/Stateright differential
# protocol-court pack (marketplace 0.1.0), vendored by priv/ggen/vendor/sync.sh
# at the pinned marketplace sha and rendered by bin/manufacture-protocol-court
# into priv/ggen/generated/protocol-court/. Locked by default like the seven
# entries above.
[packs.ash-pplan-protocol-court]
path = "priv/ggen/vendor/ash-pplan-protocol-court-pack"

# DSL pack: manufactures lib/ash_pplan/dsl* via its own bin/manufacture-dsl.
[packs.ash-pplan-dsl]
path = "priv/ggen/ash-pplan-dsl-pack"

# Reactor middleware pack: ontology + gates + templates under
