[project]
name = "ash_pplan"

# Canonical ontology every pack reads (bin/manufacture* pass --pack-dir; the
# pack ontologies are the manufactured projections' semantic source).
[ontology]
source = "ontology.ttl"

# Frontmatter schema (GgenIgniter.SchemaDispatch classifies on
# [templates].dir + [project].name + [ontology].source; project.version is a
# declarative-rules marker, so it is deliberately absent).
[templates]
dir = "priv/ggen/ash-pplan-pack/templates"

# ERRC E1 phase 1 (parity before retirement): the unbound-facts SPARQL gate
# companions from every pack verify/ directory, ported to the [law] surface.
# ggen gate semantics ([FM-LAW-013], sync time): ASK -> true is a violation,
# SELECT -> any returned row is a violation; zero rows is the pass condition,
# exactly the unbound-facts contract bin/ggen-verify enforces. All 42 gates
# return zero rows on the clean canonical ontology (court:
# test/courts/law_validate_parity_court_test.exs).
#
# NOTE: `ggen law validate` evaluates [law].rules + [law].shapes only -- it
# does NOT run [law].gates (gates gate sync). The 13-counterexample parity
# court therefore pins `law validate` parity via [law].shapes + [law].rules
# denial rules; see the court's module docs for the two dialect findings
# (sh:pattern backslash-escape, CORE_ONLY sh:sparql boundary).
#
# Former NOTE (resolved 2026-10-04): the ggen 26.9.28 [FM-CONFIG-002] parse
# refusal no longer blocks the gate — bin/conform consumes this [law] surface
# directly (E1 phase 2; FM-PACK-005 chaos placeholder cleared).
[law]
# ERRC E1 phase 2 (2026-10-04): root-level `ggen law validate` parity with
# bin/conform. shapes.ttl carries the regex-equivalent [.]-form sh:pattern
# (the \.-form false-fails ggen's SHACL engine on the clean graph);
# ontology/law_parity.n3 is the N3 denial-rule port of the 5 sh:sparql
# invariants the CORE_ONLY sh:sparql boundary skips. Verified 13/13 parity
# with the court bar (test/courts/law_validate_parity_court_test.exs).
shapes = ["ontology/shapes.ttl"]
rules = ["ontology/law_parity.n3"]
gates = [
  "priv/ggen/ash-pplan-dsl-pack/verify/010_extension.unbound.rq",
  "priv/ggen/ash-pplan-dsl-pack/verify/011_transformers.unbound.rq",
