name: CI

# Standing (see AGENTS.md) is granted by the `release-gate` job on an exact
# head. Every job below checks out `head.sha`, not the synthetic PR merge
# commit, so what is observed is what would be released.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Weekly sweep: `mix hex.audit` reads live advisory data, so a dependency can
  # turn red with no code change. Catch that on a schedule, not on someone's PR.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ash-pplan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Digest observed at ash_pplan v26.10.1; not confirmed against ggen-ecosystem
  # v26.9.29, whose own image is BLOCKED and awaiting republish.
  GGEN_ECOSYSTEM_IMAGE: ghcr.io/seanchatmangpt/ggen-ecosystem@sha256:917eb72a031da073f1d7e0c1295cda6023171275d79674b6303d5d817a3d4cb0

# Third-party actions are pinned to full commit SHAs (the trailing comment names
# the release; Dependabot keeps both current). A moved tag cannot change what
# runs in this repository.
jobs:
  semantic:
    name: semantic (pinned ggen-ecosystem)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pull pinned ggen-ecosystem image
        run: docker pull "$GGEN_ECOSYSTEM_IMAGE"
      - name: Observe ggen producer
        run: docker run --rm "$GGEN_ECOSYSTEM_IMAGE" ggen --version
      - name: Parse canonical ontology in ggen-ecosystem
        run: >-
          docker run --rm -v "$PWD:/work" -w /work "$GGEN_ECOSYSTEM_IMAGE"
          python3 bin/observe-ontology

  conformance:
    name: conformance (SHACL profile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Pinned SHACL toolchain
        run: pip install --disable-pip-version-check rdflib==7.6.0 pyshacl==0.40.1
      - name: Canonical ontology conforms to its admitted profile
        run: ./bin/conform
      - name: The profile actually refuses an unadmitted projection standing
        run: ./bin/conform-falsify

  # Independent of `semantic` and `conformance`: none of them feeds another, so
  # they run in parallel and `release-gate` joins the verdicts.
  elixir:
    name: elixir (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The full primary suite (~deps, compile, TLC court, mix check, seven
    # manufacture steps, verify-package) runs 30m+ in CI; runs 36885282071 and
    # 36890486274 were both killed at exactly 30m00s of job time with the
    # elixir legs in progress. 45 gives headroom over the observed ~30m wall.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The release toolchain: runs every release-gate step.
          - name: current
            otp: '27.3'
            elixir: '1.18.4'
            primary: true
          # mix.exs declares `elixir: "~> 1.17"`; the floor is tested, not assumed.
          - name: floor
            otp: '27.3'
            elixir: '1.17.3'
            primary: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: strict
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Pinned TLC court toolchain (tla2tools 1.7.4, SHA-256 checked)
        run: |
          dir="$HOME/.cache/autofde-lab/tla2tools/1.7.4"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$dir/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $dir/tla2tools.jar" \
            | sha256sum --check --strict
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-
      - name: Dependencies (the lock must already be current)
        run: mix deps.get --check-locked
      - name: Dependency advisories
        run: mix hex.audit
      - name: No unused entries in the lock
        run: mix deps.unlock --check-unused
      - name: Format
        if: matrix.primary
        run: mix format --check-formatted
      - name: Compile
        run: mix compile --warnings-as-errors
      # Bench gate: bin/bench runs MIX_BUILD_ROOT=_build-bench MIX_ENV=test, so it
      # compiles its own build root (covered by the same deps cache via
      # restore-keys). store_scaling.exs has no row-count knob (@sizes is
      # hardcoded at 100/1k/10k); full run observed well under 3m. Exit != 0
      # fails the job like any other step.
      - name: Bench gate (store scaling)
        if: matrix.primary
        timeout-minutes: 3
        run: ./bin/bench bench/store_scaling.exs /tmp/bench-gate.json --force
      - name: Check
        if: matrix.primary
        env:
          # the TLC differential court is mandatory in CI: unavailable raises, never skips
          ASH_PPLAN_REQUIRE_TLC: '1'
        run: mix check
      - name: Tests on the declared Elixir floor
        if: ${{ !matrix.primary }}
        env:
          ASH_PPLAN_REQUIRE_TLC: '1'
        run: mix test
      # Audit adoption #2 (lane V2): doctor preflight gate. Fail-closed: any
      # real check failure (unparseable ontology, broken gate query, stale NIF)
      # exits nonzero; the wrapper's only tolerated class is the consumer-repo
      # version-literal check, which it filters explicitly.
      - name: "ggen gate: doctor preflight (ontology/gate/template/NIF/oxigraph)"
        if: matrix.primary
        run: ./bin/ggen-doctor
      # NOTE (lane V5): bin/manufacture* now record into ONE shared manifest
      # root (tmp/mf, audit adoption #5), so repo-wide --on-stale orphan
      # detection is live; the receipt-replay court below reads that same root.
      - name: Re-manufacture exact projections
        if: matrix.primary
        run: |
          ./bin/manufacture
          ./bin/manufacture-workflow
          ./bin/manufacture-examples
          ./bin/manufacture-store-conformance
          ./bin/manufacture-durable-tla
          ./bin/manufacture-durable-chaos
          ./bin/manufacture-standing
      # Audit adoption #4 (lane V4): receipt replay as a court + dry-run drift
      # preview. Both are fail-closed and read the shared manifest root the
      # manufacture step just wrote. Budget: replay is hash comparison only;
      # the dry-run preview re-plans every recipe without writing -- minutes,
      # not tens of minutes.
      - name: "ggen gate: receipt replay court (audit #4)"
        if: matrix.primary
        run: ./bin/ggen-replay-court
      - name: "ggen gate: dry-run drift preview (audit #5)"
        if: matrix.primary
        run: ./bin/ggen-replay-court --dry-run-preview
      - name: Generated source is projection, not editing surface
        if: matrix.primary
        run: |
          git diff --exit-code -- lib/ash_pplan/catalog lib/ash_pplan/providers lib/ash_pplan/workflow/capability_catalog.ex planning/examples test/courts test/support/examples priv/tla
          test -z "$(git status --porcelain -- lib/ash_pplan/catalog lib/ash_pplan/providers lib/ash_pplan/workflow/capability_catalog.ex planning/examples test/courts test/support/examples priv/tla)"
      - name: Package compiles from its own contents
        if: matrix.primary
        run: ./bin/verify-package
      # PLACEHOLDER (lane V3 wrapper bin/ggen-engine-report not on disk at wire
      # time): engine-comparison report (audit adoption #3). Un-comment once
      # bin/ggen-engine-report exists; it should `mkdir -p tmp/engine-reports`
      # and write tmp/engine-report-<recipe>.md. Zero actuation risk
      # (diagnostic-additive), so this step may run non-blocking if desired.
      # - name: ggen gate: engine-comparison report (audit #3)
      #   if: matrix.primary
      #   run: |
      #     mkdir -p tmp/engine-reports
      #     ./bin/ggen-engine-report
      # - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   if: matrix.primary
      #   with:
      #     name: engine-report
      #     path: tmp/engine-report-*.md
      #     if-no-files-found: error
      # Audit adoption #1 (lane V1): fail-CLOSED pack verification as the last
      # ggen gate. Exit 1 on any unbound fact or cardinality breach.
      - name: "ggen gate: fail-closed pack verify (audit #1)"
        if: matrix.primary
        run: ./bin/ggen-verify
      - name: Observe and receipt the exact release head
        if: matrix.primary
        run: |
          ./bin/receipt > release-receipt.json
          cat release-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.primary
        with:
          name: release-receipt
          path: release-receipt.json

  # The one check to require in branch protection. It runs even when a job it
  # depends on failed or was skipped, and passes only if every one succeeded.
  release-gate:
    name: release-gate
    if: ${{ always() }}
    needs: [semantic, conformance, elixir]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate succeeded on the exact head
        env:
          SEMANTIC: ${{ needs.semantic.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
          ELIXIR: ${{ needs.elixir.result }}
        run: |
          echo "semantic=$SEMANTIC conformance=$CONFORMANCE elixir=$ELIXIR"
          for verdict in "$SEMANTIC" "$CONFORMANCE" "$ELIXIR"; do
            test "$verdict" = success || { echo "release gate REFUSED"; exit 1; }
          done
          echo "release gate observed on ${{ github.event.pull_request.head.sha || github.sha }}"
